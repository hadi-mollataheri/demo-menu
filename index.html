<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo-menu</title>
    <link href="/src/style.css" rel="stylesheet" />
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body class="m-5">
    <header class="h-52 w-full">
      <nav>
        <div id="cats-search-container">
          <div id="cats-container" class="my-7"></div>

          <div id="search-container" class="">
            <form class="flex flex-col">
              <label for="search" class="w-30">جستجوی محصول</label>
              <input
                id="search"
                type="search"
                placeholder="مثال: قهوه"
                class="w-full pr-1.5 border-b outline-0"
              />
              <input
                type="submit"
                class="self-end cursor-pointer hover:font-semibold w-19 h-6"
                value="جست و جو"
              />
            </form>
          </div>
        </div>

        <div id="quick-filters" class="my-7 flex justify-between">
          <div id="filters" class="w-1/2">
            <label for="dropdown-options">فیلتر ها</label>
            <select id="dropdown-options" name="filter">
              <option
                value=""
                selected="selected"
                disabled
                class="qFilter-item"
              >
                لطفا یک گزینه را انتخاب کنید
              </option>
              <option value="tea" class="qFilter-item">چای</option>
              <option value="coffee" class="qFilter-item">قهوه</option>
              <option value="dessert" class="qFilter-item">دسر</option>
            </select>
          </div>
          <div class="availibility-checkbox" class="w-1/2">
            <label for="availibility-check">فقط موجود</label>
            <input
              id="availibility-check"
              type="checkbox"
              name="just-available"
              value="just-available-true"
            />
          </div>
        </div>
      </nav>
    </header>
    <main class="max-w-5xl mx-auto">
      <!-- FIX: Grid is broken -->
      <div
        id="products"
        class="grid gap-10 justify-items-center grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
      ></div>
    </main>
    <footer></footer>
  </body>
</html>
